[package]
name = "annote"
version = "0.1.0"
edition = "2024"
description = "A simple note app that build for testing aimer ability...."

[lib]
path = "src/main.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# aimer = {git="https://github.com/Cottons29/aimer.git", branch = "main"}

aimer = { path = "../aimer", features = ["provider", "svg", "icons", "native", "markdown", "markdown-syntect", "image-picker"] }

# Dev builds of these crates are optimized, which the aimer workspace's own profile does not
# pass on to an app: the markdown parser and the Unicode tables it and the text layout search,
# and the byte-scan kernels, which run a vector at a time only when they are optimized.
# (This is compiler optimization, which aimer's AGENTS.md asks not to lean on; it is here at the
# app owner's request, not as a substitute for making the code itself fast.)
[profile.dev.package.markdown]
opt-level = 3

[profile.dev.package.unicode-segmentation]
opt-level = 3

[profile.dev.package.aimer_simd]
opt-level = 3
